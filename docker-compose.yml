
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/studyvault.db:/app/studyvault.db
      - ./backend/uploads:/app/uploads
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_cache:
